id: ww2
nombre: "Segunda Guerra Mundial"
epoca: "1944, frente occidental"
descripcion: >
  Infantería aliada en Normandía tras el desembarco. Pensado para mods como
  Spearhead 1944 o IFA3. Setos (bocage), granjas de piedra y carreteras estrechas.
bando_ia:
  nombre: "Compañía Easy"
  descripcion: "Infantería aliada con fusiles, subfusiles y alguna ametralladora ligera."
enemigo:
  nombre: "Wehrmacht"
  descripcion: "Infantería alemana veterana con ametralladoras MG42 y posiciones preparadas."
estilo_comunicacion: >
  Radio de campaña de la época (SCR-300) o enlaces a pie: frases formales y cortas.
  Nada de jerga moderna: ni GPS, ni drones, ni "LZ". Referencias por cuadrícula del mapa
  y por accidentes del terreno ("la granja", "el seto norte").
doctrina:
  - "Fuego y movimiento por pelotones: una sección cubre mientras la otra avanza."
  - "Las ametralladoras enemigas son la amenaza principal: localizarlas y flanquearlas."
  - "Aprovechar setos, muros y bosques para avanzar a cubierto."
  - "Consolidar el terreno ganado antes de seguir: el contraataque alemán es habitual."
restricciones:
  - "No hay helicópteros ni apoyo aéreo a demanda."
  - "No hay GPS ni visión nocturna."
  - "Las comunicaciones son lentas: las órdenes tardan en llegar."
reglas_enfrentamiento: []
personalidad_mando: "Capitán curtido, sobrio y paternal con sus hombres. Odia desperdiciar vidas."
medios_aereos: false
retardo_radio_s: 30
indicativo_mando: "Puesto de Mando"
indicativo_enlace: "Operador de radio"
indicativos:
  infanteria: ["Able", "Baker", "Charlie", "Dog", "Easy"]
  motorizada: ["Jeep-1", "Jeep-2"]
  blindado: ["Sherman-1", "Sherman-2"]
vocabulario: ["Roger", "Wilco", "cambio y corto", "a la orden, mi capitán"]
