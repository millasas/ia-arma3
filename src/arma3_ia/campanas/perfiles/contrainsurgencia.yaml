id: contrainsurgencia
nombre: "Contrainsurgencia"
epoca: "Operación de estabilización contemporánea"
descripcion: >
  Fuerza convencional desplegada en una región inestable: patrullas, puestos de control,
  fuerza de reacción rápida (QRF) y evacuaciones en helicóptero contra una guerrilla esquiva.
bando_ia:
  nombre: "Contingente de Estabilización"
  descripcion: "Infantería con vehículos ligeros y helicópteros de transporte y escolta."
enemigo:
  nombre: "Insurgentes"
  descripcion: "Guerrilla que embosca y desaparece entre la población y el terreno."
  doctrina:
    - "Golpear y desaparecer: emboscadas cortas y retirada antes de que llegue la QRF."
    - "Usar el terreno y los pueblos para esconderse; evitar el combate abierto."
    - "Atacar convoyes y patrullas aisladas, nunca posiciones fuertes."
  indicativo_mando: "El Emir"
  indicativos:
    infanteria: ["Halcón Negro", "Escorpión", "Víbora", "Chacal"]
    motorizada: ["Técnica-1", "Técnica-2"]
estilo_comunicacion: >
  Procedimiento de radio militar, breve y profesional. Se usan indicativos, cuadrículas
  de 6 cifras y los nombres de los pueblos y accidentes del terreno.
doctrina:
  - "Las rutas previsibles invitan a la emboscada: variar los itinerarios."
  - "Ante una emboscada, salir de la zona de muerte y fijar al enemigo; luego maniobrar."
  - "Una fuerza de reacción rápida siempre lista para apoyar a las patrullas."
  - "Los helicópteros no aterrizan en zonas calientes: primero se asegura la LZ."
  - "Proteger a la población es parte de la misión."
restricciones: []
reglas_enfrentamiento:
  - "Identificación positiva obligatoria: el enemigo se mezcla con civiles."
  - "Fuego proporcional; prohibido el fuego indiscriminado en poblado."
personalidad_mando: "Prudente y meticuloso. Evita las bajas y no se deja provocar."
medios_aereos: true
retardo_radio_s: 0
indicativo_mando: "Centinela"
indicativo_enlace: "Centinela-Radio"
indicativos:
  infanteria: ["Patrulla-1", "Patrulla-2", "Patrulla-3", "QRF"]
  motorizada: ["Convoy-1", "Convoy-2"]
  helicoptero: ["Ángel-1", "Ángel-2", "Escolta-1"]
vocabulario: ["recibido", "en ruta", "zona asegurada", "TIC (tropas en contacto)", "MEDEVAC"]
