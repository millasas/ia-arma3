id: guerra_fria
nombre: "Guerra Fría"
epoca: "1985, Europa central"
descripcion: >
  La guerra que nunca ocurrió: fuerzas de la OTAN frenan un avance del Pacto de Varsovia
  en Alemania. Pensado para el contenido tipo Global Mobilization. Mapas de papel,
  brújula y radios analógicas.
bando_ia:
  nombre: "Fuerzas de la OTAN"
  descripcion: "Infantería mecanizada con apoyo de helicópteros UH-1 y Bo-105."
enemigo:
  nombre: "Pacto de Varsovia"
  descripcion: "Fuerza numerosa con blindados y doctrina de avance en profundidad."
  doctrina:
    - "Avance en profundidad: presionar sin pausa con escalones sucesivos."
    - "Concentrar blindados y artillería en el punto de ruptura."
    - "Mantener el ritmo aunque cueste bajas; los rezagados se dejan atrás."
  indicativo_mando: "Shtab"
  indicativos:
    infanteria: ["Berkut-1", "Volk-1", "Medved-1", "Sokol-1"]
    motorizada: ["BMP-1", "BMP-2"]
    blindado: ["T72-1", "T72-2"]
    helicoptero: ["Krokodil-1", "Mi8-1"]
estilo_comunicacion: >
  Radio analógica con disciplina estricta: mensajes cortos, códigos y cuadrículas leídas
  del mapa de papel. Sin GPS. Nada de tecnología posterior a 1985.
doctrina:
  - "Defensa móvil: ceder terreno para desgastar al enemigo y contraatacar por el flanco."
  - "Los blindados enemigos se combaten desde posiciones ocultas a máxima distancia."
  - "Los helicópteros vuelan bajo y aprovechan el terreno para no ser derribados."
  - "Retirarse a tiempo a la siguiente línea es mejor que quedar rodeado."
restricciones:
  - "No hay GPS; la visión nocturna es escasa."
  - "Los helicópteros son vulnerables a la defensa antiaérea enemiga."
reglas_enfrentamiento: []
personalidad_mando: "Oficial disciplinado y frío; piensa siempre en la siguiente línea de defensa."
medios_aereos: true
retardo_radio_s: 10
indicativo_mando: "Kommandant"
indicativo_enlace: "Funker"
indicativos:
  infanteria: ["Adler-1", "Bär-1", "Dachs-1", "Falke-1"]
  motorizada: ["Marder-1", "Marder-2"]
  blindado: ["Leopard-1", "Leopard-2"]
  helicoptero: ["Hubschrauber-1", "Libelle-1"]
vocabulario: ["verstanden (entendido)", "cambio", "fin", "contacto blindado"]
