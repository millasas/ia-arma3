[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arma3-ia"
version = "0.2.0"
description = "IA local (Ollama) para ARMA 3: Zeus crea y dirige campañas por encargo y los NPC deciden por su cuenta."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Privado" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
arma3-ia = "arma3_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: necesita un servidor Ollama real con el modelo descargado (se omite si no hay)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B905"]

[tool.mypy]
python_version = "3.10"
packages = ["arma3_ia"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
